name: Talos E2E Test

on:
  pull_request:
    branches: [ master, main ]
    paths:
      - 'deploy/csi-smb-**.yaml'
      - 'charts/latest/csi-driver-smb/**'
      - 'test/talos-e2e/**'
      - '.github/workflows/talos-e2e.yml'
  workflow_dispatch:

jobs:
  talos-e2e-test:
    name: Talos E2E Test with External SMB and DNS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install talosctl
        run: |
          curl -sL https://talos.dev/install | sh
          sudo mv talosctl /usr/local/bin/
          talosctl version --client
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'
      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'
      
      - name: Verify Docker
        run: |
          docker --version
          docker ps
      
      - name: Run Talos E2E Test
        run: |
          cd test/talos-e2e
          ./run-talos-e2e-test.sh
        env:
          TALOS_VERSION: v1.6.0
          KUBERNETES_VERSION: v1.29.0
      
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Talos Cluster Info ==="
          talosctl cluster show --name smb-talos-test || true
          
          echo "=== Kubernetes Nodes ==="
          kubectl get nodes -o wide || true
          
          echo "=== CSI Driver Pods ==="
          kubectl get pods -n kube-system -l app.kubernetes.io/name=csi-driver-smb -o wide || true
          
          echo "=== Controller Pod Logs ==="
          kubectl logs -n kube-system -l app=csi-smb-controller --all-containers --tail=100 || true
          
          echo "=== Node Pod Logs ==="
          kubectl logs -n kube-system -l app=csi-smb-node --all-containers --tail=100 || true
          
          echo "=== Test Resources ==="
          kubectl get pvc,pv,pod || true
          kubectl describe pvc smb-pvc || true
          kubectl describe pod smb-test-pod || true
          
          echo "=== SMB Server Container ==="
          docker logs smb-server --tail=100 || true
          
          echo "=== DNS Server Container ==="
          docker logs dns-server --tail=100 || true
      
      - name: Cleanup
        if: always()
        run: |
          # Cleanup is handled by the test script trap
          echo "Cleanup handled by test script"
